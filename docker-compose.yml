services:
  postgres:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/incident-postgres:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: incident_postgres
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
    volumes:
      - vault_tok_postgres:/vault/token:ro
      - postgres_data:/var/lib/postgresql
    networks:
      - incident_network
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-backup:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/incident-postgres-backup:${IMAGE_TAG:?Set IMAGE_TAG}
    profiles: ["extras"]
    container_name: incident_postgres_backup
    restart: always
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
      POSTGRES_HOST: postgres
    volumes:
      - vault_tok_backup:/vault/token:ro
      - ./backups:/backups
    networks:
      - incident_network
    depends_on:
      postgres:
        condition: service_healthy

  vault:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/incident-vault:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: incident_vault
    cap_add:
      - IPC_LOCK
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
    volumes:
      - vault_init:/vault/init
      - vault_data:/vault/data
      - vault_tok_backend:/vault/tokens/backend
      - vault_tok_postgres:/vault/tokens/postgres
      - vault_tok_grafana:/vault/tokens/grafana
      - vault_tok_exporter:/vault/tokens/exporter
      - vault_tok_backup:/vault/tokens/backup
      - vault_tok_migrate:/vault/tokens/migrate
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/init/.ready && vault status -format=json | jq -e '.sealed == false' >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 60
    networks:
      - incident_network

  prometheus:
    image: prom/prometheus:v3.13.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - incident_network

  backend:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/incident-backend:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      APP_URL: ${APP_URL}
      TZ: ${TZ}
      IMPORT_MAX_FILE_BYTES: ${IMPORT_MAX_FILE_BYTES:-1048576}
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/v1/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
    volumes:
      - vault_tok_backend:/vault/token:ro
    networks:
      - incident_network

  frontend:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/incident-frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: incident_frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - incident_network

  grafana:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/incident-grafana:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: grafana
    restart: unless-stopped
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
      GF_SERVER_ROOT_URL: "${APP_URL:?Set APP_URL}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SERVER_PROTOCOL: "http"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?Set DISCORD_WEBHOOK_URL}
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - vault_tok_grafana:/vault/token:ro
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - incident_network

  waf:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/incident-waf:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: incident_waf
    environment:
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - /etc/incident-waf/certs:/etc/nginx/tls:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./infra/waf/grafana-exclusion.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    depends_on:
      grafana:
        condition: service_started
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - incident_network

  postgres-exporter:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/incident-postgres-exporter:${IMAGE_TAG:?Set IMAGE_TAG}
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SCRAPE_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - vault_tok_exporter:/vault/token:ro
    networks:
      - incident_network

  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node_exporter
    command:
      - "--path.rootfs=/host"
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave

  migrate:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME}/incident-migrate:${IMAGE_TAG:?Set IMAGE_TAG}
    profiles: ["tools"]
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - vault_tok_migrate:/vault/token:ro
    networks:
      - incident_network

volumes:
  prometheus_data:
  postgres_data:
  vault_init:
  vault_data:
  vault_tok_backend:
  vault_tok_postgres:
  vault_tok_grafana:
  vault_tok_exporter:
  vault_tok_backup:
  vault_tok_migrate:
  grafana-data:

networks:
  incident_network:
    driver: bridge
