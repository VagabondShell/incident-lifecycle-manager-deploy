apiVersion: 1
groups:
  - orgId: 1
    name: availability-ui
    folder: Monitoring
    interval: 30s
    rules:
      - uid: cg372f5i1ubr4a
        title: Node Exporter unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up{job="node_exporter"}
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: sufhrcg
        panelId: 5
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          __dashboardUid__: sufhrcg
          __panelId__: "5"
          description: |-
            Prometheus has been unable to scrape Node Exporter for at least 1 minute. Host resource monitoring is unavailable.

            Check the node_exporter container, its logs, and the Prometheus target error.
          summary: "Node Exporter unreachable: {{ $labels.instance }}"
        labels:
          service: node_exporter
          severity: warning
        isPaused: false
        notification_settings:
          receiver: discord-monitoring
      - uid: bg3785pargb9cb
        title: Host disk space low
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                100 *
                node_filesystem_avail_bytes{
                  job="node_exporter",
                  mountpoint="/"
                }
                /
                node_filesystem_size_bytes{
                  job="node_exporter",
                  mountpoint="/"
                }
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 15
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: |-
            Available disk space has remained below 15% for 5 minutes.
            Check disk usage, growing logs, and unused files.
          summary: Low disk space on {{ $labels.instance }}
        labels:
          service: host
          severity: warning
        isPaused: false
        notification_settings:
          receiver: discord-monitoring
      - uid: ag378fljv4buoe
        title: Host CPU usage high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                100 * (
                  1 - avg by (instance) (
                    rate(node_cpu_seconds_total{
                      job="node_exporter",
                      mode="idle"
                    }[5m])
                  )
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: sufhrcg
        panelId: 1
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          __dashboardUid__: sufhrcg
          __panelId__: "1"
          description: |-
            CPU utilization averaged over 5 minutes has remained above 85% for 10 minutes.
            Check busy processes, container CPU usage, and recent workload changes.
          summary: High CPU usage on {{ $labels.instance }}
        labels:
          service: host
          severity: warning
        isPaused: false
        notification_settings:
          receiver: discord-monitoring
      - uid: fg378xgrvcbgge
        title: Backend error rate high
        condition: D
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                100 *
                (
                  sum(rate(http_request_duration_seconds_count{
                    job="backend", status=~"5.."
                  }[5m])) or vector(0)
                )
                /
                clamp_min(
                  sum(rate(http_request_duration_seconds_count{
                    job="backend"
                  }[5m])),
                  0.000000001
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |-
                sum(increase(http_request_duration_seconds_count{
                  job="backend"
                }[5m]))
              hide: false
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: B
          - refId: D
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: ($A > 5) && ($B >= 100)
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: D
              type: math
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: |-
            More than 5% of requests are returning HTTP 5xx responses, with at least 100 requests in the rolling 5-minute window.
            This condition has persisted for 5 minutes.
            Check application logs, failing routes, and database connectivity.
          summary: Backend HTTP 5xx error rate is high
        labels:
          service: backend
          severity: warning
        isPaused: false
        notification_settings:
          receiver: discord-monitoring
      - uid: dg379bulo2ayod
        title: Backend response time high
        condition: D
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: |-
                histogram_quantile(
                  0.95,
                  sum by (le) (
                    rate(http_request_duration_seconds_bucket{
                      job="backend"
                    }[5m])
                  )
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |-
                sum(increase(http_request_duration_seconds_count{
                  job="backend"
                }[5m]))
              hide: false
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: B
          - refId: D
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: ($A > 1) && ($B >= 100)
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: D
              type: math
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: |-
            Estimated p95 response time exceeds 1 second, with at least 100 requests in the rolling 5-minute window.
            This condition has persisted for 5 minutes.
            Check slow routes, database queries, and CPU or memory pressure.
          summary: Backend p95 response time is high
        labels:
          service: backend
          severity: warning
        isPaused: false
        notification_settings:
          receiver: discord-monitoring
