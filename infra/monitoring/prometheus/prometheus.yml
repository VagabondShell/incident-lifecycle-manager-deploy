global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:3000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: node_exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
