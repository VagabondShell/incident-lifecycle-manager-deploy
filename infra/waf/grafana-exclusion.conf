# Grafana sends PromQL as JSON to /grafana/api/ds/query.
# CRS rule 942100 (libinjection SQLi) wrongly flags expressions like
# "100 * (1 - avg(rate(...)))" and "... or vector(0)", so the WAF returned 403
# and some panels showed "No data".
# Skip only that one rule, only for the query fields, only on that one URL.
# All other CRS rules still apply.
SecRule REQUEST_URI "@beginsWith /grafana/api/ds/query" \
  "id:1000100,phase:1,pass,nolog,\
   ctl:ruleRemoveTargetById=942100;ARGS:/^json\.queries/"
